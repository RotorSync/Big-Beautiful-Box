[all]

# HAT v2 has no UART on GPIO 14/15 (no /dev/ttyAMA0 switch box link).
# Onboard Bluetooth stays disabled: rotorsync_bumble owns the USB adapters.
dtoverlay=disable-bt

# SPI for IOL HAT
dtparam=spi=on
dtoverlay=spi0-2cs

# HAT v2 CAN: MCP2518FD (U12) on SPI1 CE0 (GPIO18), nINT on GPIO26,
# 40 MHz crystal (Y1). spidev off so mcp251xfd can bind spi1.0.
dtoverlay=spi1-1cs,cs0_spidev=off
dtoverlay=mcp251xfd,spi1-0,oscillator=40000000,interrupt=26

# HDMI defaults
hdmi_force_hotplug=1
hdmi_drive=2
hdmi_group=1
hdmi_mode=34
